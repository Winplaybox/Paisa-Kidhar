# Render Blueprint — free web service for the Python API.
# Render dashboard → New → Blueprint → pick this repo. No secrets needed (publishable key only; RLS protects data).
services:
  - type: web
    name: paisa-kidhar-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SUPABASE_URL
        value: https://xatbfyiytcnogfbtfsym.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_QpEcKrru1S6jW-k6llv30Q_4mV1QXO7
      - key: ENVIRONMENT
        value: production
