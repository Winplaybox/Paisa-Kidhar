name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check app tests
      - run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
      - run: pip-audit -r requirements.txt

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor || true
      - run: node scripts/package-web-release.mjs
        env:
          EXPO_PUBLIC_ADSENSE_REGISTRY_SLOT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_REGISTRY_SLOT_ID }}
      - run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        with:
          name: paisa-kidhar-web-${{ github.sha }}
          path: apps/mobile/dist/site.zip
          if-no-files-found: error
